name: Test Action

# This workflow tests the dotnet-test-shard GitHub Action
# References:
# - Testing GitHub Actions: https://blog.codacy.com/how-to-test-github-actions
# - Beautiful .NET Test Reports: https://seankilleen.com/2024/03/beautiful-net-test-reports-using-github-actions/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  # Verify dist/ is up-to-date with source code
  verify-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          # Exclude .d.ts.map files as they contain absolute paths that differ between environments
          if [[ -n "$(git status --porcelain dist/ | grep -v '\.d\.ts\.map$')" ]]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the changes."
            git diff dist/ -- ':!*.d.ts.map'
            exit 1
          fi
          echo "dist/ is up-to-date"

  # Unit tests for the TypeScript action code
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Build the action
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Run baseline tests to verify the test project works
  verify-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Run all tests (baseline)
        run: |
          cd test-project
          dotnet test --logger "trx;LogFileName=baseline.trx" --results-directory ../TestResults

      - name: Upload baseline results
        uses: actions/upload-artifact@v6
        with:
          name: baseline-results
          path: TestResults/
          retention-days: 7

  # Test the sharding action with 4 shards
  test-sharding:
    needs: [build, verify-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Run tests with sharding (shard ${{ matrix.shard }}/4)
        id: test
        uses: ./
        with:
          shard: ${{ matrix.shard }}
          total-shards: 4
          test-project: ./test-project
          configuration: Debug
          results-directory: TestResults/shard-${{ matrix.shard }}

      - name: Verify shard results
        run: |
          echo "Tests run: ${{ steps.test.outputs.tests-run }}"
          echo "Tests passed: ${{ steps.test.outputs.tests-passed }}"
          echo "Tests failed: ${{ steps.test.outputs.tests-failed }}"
          echo "Tests skipped: ${{ steps.test.outputs.tests-skipped }}"
          echo "Result file: ${{ steps.test.outputs.result-file }}"

          TESTS_RUN="${{ steps.test.outputs.tests-run }}"
          if [[ "$TESTS_RUN" -lt 5 ]]; then
            echo "::error::Expected at least 5 tests in shard, got $TESTS_RUN"
            exit 1
          fi

      - name: Upload shard results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: TestResults/
          retention-days: 7

  # Verify all tests were run exactly once across all shards
  verify-sharding:
    needs: test-sharding
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all shard results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-shard-*
          merge-multiple: true
          path: TestResults

      - name: Download baseline results
        uses: actions/download-artifact@v7
        with:
          name: baseline-results
          path: BaselineResults

      - name: Verify test coverage
        run: |
          BASELINE_TOTAL=$(grep -oP 'total="\K[0-9]+' BaselineResults/baseline.trx | head -1)
          echo "Baseline total tests: $BASELINE_TOTAL"

          SHARD_TOTAL=0
          for trx in TestResults/*.trx; do
            if [[ -f "$trx" ]]; then
              COUNT=$(grep -oP 'total="\K[0-9]+' "$trx" | head -1 || echo "0")
              echo "$(basename $trx): $COUNT tests"
              SHARD_TOTAL=$((SHARD_TOTAL + COUNT))
            fi
          done
          echo "Total tests across shards: $SHARD_TOTAL"

          if [[ "$BASELINE_TOTAL" != "$SHARD_TOTAL" ]]; then
            echo "::error::Test count mismatch! Baseline: $BASELINE_TOTAL, Shards total: $SHARD_TOTAL"
            exit 1
          fi

          echo "::notice::All $BASELINE_TOTAL tests were distributed correctly across shards!"

  # Aggregate and publish test results
  test-report:
    needs: [verify-sharding]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          merge-multiple: true
          path: TestResults

      - name: Download baseline results
        uses: actions/download-artifact@v7
        with:
          name: baseline-results
          path: BaselineResults

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: '.NET Test Results'
          path: 'TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: false

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            TestResults/*.trx
            BaselineResults/*.trx
          check_name: 'Test Results Summary'
          comment_title: '📊 Test Results'
          comment_mode: always

  # Test edge cases
  test-edge-cases:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 1
            expected-min: 30
          - shard: 1
            total: 100
            expected-min: 0
    steps:
      - uses: actions/checkout@v6

      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Run edge case test
        id: test
        uses: ./
        with:
          shard: ${{ matrix.shard }}
          total-shards: ${{ matrix.total }}
          test-project: ./test-project

      - name: Verify results
        run: |
          TESTS_RUN="${{ steps.test.outputs.tests-run }}"
          EXPECTED_MIN="${{ matrix.expected-min }}"
          echo "Tests run: $TESTS_RUN (expected at least $EXPECTED_MIN)"
          if [[ "$TESTS_RUN" -lt "$EXPECTED_MIN" ]]; then
            echo "::error::Expected at least $EXPECTED_MIN tests, got $TESTS_RUN"
            exit 1
          fi

  # Test with filter option
  test-with-filter:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Run filtered tests
        uses: ./
        with:
          shard: 1
          total-shards: 2
          test-project: ./test-project
          filter: 'FullyQualifiedName~AlphaTests'
