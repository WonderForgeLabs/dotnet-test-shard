name: Release

# Updates floating version tags (v1, v1.0) when a release is published.
# The actual release and tag are created by publishing the draft from release-drafter.
#
# Workflow:
# 1. release-drafter.yml drafts release notes on each PR merge
# 2. Edit the draft release in GitHub UI, set the version tag (e.g., v1.0.1)
# 3. Publish the release - GitHub creates the tag automatically
# 4. This workflow updates v1 and v1.0 tags to point to the new release
#
# References:
# - GitHub Actions versioning: https://docs.github.com/en/actions/creating-actions/about-custom-actions#using-tags-for-release-management
# - Release Drafter: https://github.com/release-drafter/release-drafter

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest
    # Skip prereleases (e.g., v1.0.0-beta.1)
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"

          # Validate semver format
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Skipping tag update for non-semver tag: $VERSION"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          MAJOR=$(echo "$VERSION" | sed -E 's/^(v[0-9]+).*/\1/')
          MINOR=$(echo "$VERSION" | sed -E 's/^(v[0-9]+\.[0-9]+).*/\1/')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Update floating version tags
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update major version tag (v1 -> latest v1.x.x)
          echo "Updating $MAJOR to point to $VERSION"
          git tag -fa "$MAJOR" "$VERSION" -m "Update $MAJOR to $VERSION"
          git push origin "$MAJOR" --force

          # Update minor version tag (v1.0 -> latest v1.0.x)
          echo "Updating $MINOR to point to $VERSION"
          git tag -fa "$MINOR" "$VERSION" -m "Update $MINOR to $VERSION"
          git push origin "$MINOR" --force

      - name: Summary
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"

          echo "## 🏷️ Version Tags Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Points To |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`$MAJOR\` | $VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| \`$MINOR\` | $VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can now use:" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "- uses: WonderForgeLabs/dotnet-test-shard@$MAJOR" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
