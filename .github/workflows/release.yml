name: Release

# Updates floating version tags (v1, v1.0) when a release is published.
# The release and tag are created by publishing the draft from release-drafter.
#
# References:
# - nowactions/update-majorver: https://github.com/nowactions/update-majorver
# - GitHub Actions versioning: https://docs.github.com/en/actions/creating-actions/about-custom-actions#using-tags-for-release-management

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-tags:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Update major version tag
        uses: nowactions/update-majorver@v1
        with:
          tag: ${{ github.event.release.tag_name }}

      - name: Update minor version tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"

          # Extract minor version (v1.0 from v1.0.0)
          if [[ "$VERSION" =~ ^(v[0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            MINOR="${BASH_REMATCH[1]}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$MINOR" "$VERSION" -m "Update $MINOR to $VERSION"
            git push origin "$MINOR" --force
            echo "Updated $MINOR → $VERSION"
          fi
