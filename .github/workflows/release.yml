name: Release

# Updates major version tag (v1) when a release is published.
# The release and tag are created by publishing the draft from release-drafter.
#
# References:
# - nowactions/update-majorver: https://github.com/nowactions/update-majorver
# - GitHub Actions versioning: https://docs.github.com/en/actions/creating-actions/about-custom-actions#using-tags-for-release-management

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  update-tags:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: nowactions/update-majorver@v1
