# Dependabot configuration for automatic dependency updates
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      # Group all GitHub Actions updates into a single PR
      github-actions:
        patterns:
          - "*"

  # npm dependencies for the TypeScript action
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    groups:
      # Group @actions packages
      actions:
        patterns:
          - "@actions/*"
      # Group development dependencies
      dev:
        dependency-type: "development"

  # NuGet dependencies for the test project
  - package-ecosystem: "nuget"
    directory: "/test-project"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "nuget"
    open-pull-requests-limit: 5
    groups:
      # Group xUnit and test framework updates
      testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test*"
          - "coverlet*"
      # Group all other nuget updates
      nuget-other:
        patterns:
          - "*"
